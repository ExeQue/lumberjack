name: Documentation

on:
  push:
    branches: [ "main" ]
    # A release tag deploys, like the Docker image; path filters do not apply to tags.
    tags: [ 'v*' ]
    paths: &docs
      - 'README.md'
      - 'docs/**'
      - '.vitepress/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
      - 'install.sh'
      - 'compose.yaml'
      - '.env.docker.example'
  pull_request:
    branches: [ "main" ]
    paths: *docs
  workflow_dispatch:

# Every run builds: VitePress fails on a dead link, which is the check that matters.
# Only a release tag or a manual run deploys, so the site matches the released image.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # for lastUpdated timestamps

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run docs:build

      # The install script and the files it downloads, from the same release as the docs.
      - name: Add the install files
        run: cp install.sh compose.yaml .vitepress/dist/ && cp .env.docker.example .vitepress/dist/env.docker.example

      - name: Upload the artifact
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The install files go on the release too, with their checksums, so what the docs
  # site serves can be checked against what was released.
  release-files:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Attach the install files and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release && cd release
          cp ../install.sh ../compose.yaml .
          cp ../.env.docker.example env.docker.example
          sha256sum install.sh compose.yaml env.docker.example > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" install.sh compose.yaml env.docker.example SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
