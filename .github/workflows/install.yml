name: Install script

# Runs install.sh the way the docs say, with Docker and with Podman, against the
# published image: a first install, an update that keeps an edited compose.yaml,
# and a second run that finds the install and updates it.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'install.sh'
      - 'compose.yaml'
      - '.env.docker.example'
      - '.github/workflows/install.yml'
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        engine: [ docker, podman ]

    name: ${{ matrix.engine }}

    env:
      ENGINE: ${{ matrix.engine }}
      # The runner has Docker too, and podman compose would hand the work to its
      # docker-compose; a Podman-only server uses podman-compose.
      PODMAN_COMPOSE_PROVIDER: podman-compose

    steps:
      - uses: actions/checkout@v7

      - name: Install podman-compose
        if: matrix.engine == 'podman'
        run: sudo apt-get update -q && sudo apt-get install -y -q podman-compose

      # The same three files the docs site serves, from this commit.
      - name: Serve the install files
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp install.sh compose.yaml "$RUNNER_TEMP/site/"
          cp .env.docker.example "$RUNNER_TEMP/site/env.docker.example"
          (cd "$RUNNER_TEMP/site" && python3 -m http.server 8999 > /dev/null 2>&1 &)
          sleep 1

      - name: Install
        working-directory: ${{ runner.temp }}
        env:
          LUMBERJACK_SOURCE: http://localhost:8999
          APP_URL: http://localhost:8080
        run: |
          curl -fsSL "$LUMBERJACK_SOURCE/install.sh" | sh -s "$ENGINE" | tee install.log
          grep -q 'setup token' install.log
          test -x lumberjack/update.sh
          grep -q "^COMPOSE=\"$ENGINE compose\"$" lumberjack/update.sh
          test "$(stat -c %a lumberjack/.env.docker)" = 600
          # The database and the storage land in folders next to compose.yaml. They
          # belong to the containers' users, so root looks.
          sudo find lumberjack/data/postgres -mindepth 1 | grep -q .
          sudo test -d lumberjack/data/storage/app/setup
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/setup)" = 200

      - name: Update keeps an edited compose.yaml
        working-directory: ${{ runner.temp }}
        run: |
          echo '# my own tweak' >> lumberjack/compose.yaml
          app() { "$ENGINE" ps -q --filter label=com.docker.compose.service=lumberjack; }
          before=$("$ENGINE" inspect -f '{{.Created}}' "$(app)")
          lumberjack/update.sh
          after=$("$ENGINE" inspect -f '{{.Created}}' "$(app)")
          test "$before" != "$after"
          tail -1 lumberjack/compose.yaml | grep -q 'my own tweak'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/setup)" = 200

      - name: A second run finds the install
        working-directory: ${{ runner.temp }}
        env:
          LUMBERJACK_SOURCE: http://localhost:8999
        run: |
          curl -fsSL "$LUMBERJACK_SOURCE/install.sh" | sh | tee rerun.log
          grep -q "Using $ENGINE compose" rerun.log
          grep -q 'Already installed' rerun.log

      - name: Logs
        if: failure()
        working-directory: ${{ runner.temp }}/lumberjack
        run: $ENGINE logs --tail 100 "$($ENGINE ps -aq --filter label=com.docker.compose.service=lumberjack)"
