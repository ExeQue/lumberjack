name: Docker image

# Only a release tag (v1.2.3) builds and publishes an image.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Build for this runner first and check that it starts before publishing anything.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lumberjack:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          cat > .env.docker <<ENV
          APP_URL=http://localhost:8080
          APP_KEY=base64:$(openssl rand -base64 32)
          DB_PASSWORD=smoke
          ENV
          sed -i 's#ghcr.io/exeque/lumberjack:latest#lumberjack:smoke#' compose.yaml
          docker compose --env-file .env.docker up -d
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/up >/dev/null && break
            sleep 2
          done
          docker compose --env-file .env.docker logs lumberjack | tail -50
          curl -fsS http://localhost:8080/up
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/setup)" = 200
          docker compose --env-file .env.docker logs lumberjack | grep -q 'enter this setup token'

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
