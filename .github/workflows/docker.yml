name: Docker image

# Only a release tag (v1.2.3) builds and publishes an image.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  # Build for this runner and check that it starts before publishing anything.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lumberjack:smoke
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      - name: Smoke test
        run: |
          # The key the way the docs make it: a one-off run of the image itself.
          key=$(docker run --rm lumberjack:smoke php artisan key:generate --show)
          case "$key" in base64:*) ;; *) echo "key:generate gave: $key"; exit 1 ;; esac
          cat > .env.docker <<ENV
          APP_URL=http://localhost:8080
          APP_KEY=$key
          DB_PASSWORD=smoke
          ENV
          sed -i 's#ghcr.io/exeque/lumberjack:latest#lumberjack:smoke#' compose.yaml
          docker compose --env-file .env.docker up -d
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/up >/dev/null && break
            sleep 2
          done
          docker compose --env-file .env.docker logs lumberjack | tail -50
          curl -fsS http://localhost:8080/up
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/setup)" = 200
          docker compose --env-file .env.docker logs lumberjack | grep -q 'enter this setup token'

  # Each platform builds on its own runner, in parallel, and pushes by digest.
  build:
    needs: smoke
    strategy:
      matrix:
        # amd64 only while the repository is private: native arm64 runners are free
        # for public repositories only, and arm64 under QEMU takes most of an hour.
        # Once public, arm64 builds natively alongside amd64 with no change here.
        include: ${{ fromJSON(github.event.repository.private && '[{"platform":"linux/amd64","runner":"ubuntu-latest"}]' || '[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Image names are lower case; the repository is ExeQue/lumberjack.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: scope
        run: echo "name=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels (version, source, revision) on each platform's image, not the base image's.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.scope.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.scope.outputs.name }}

      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.scope.outputs.name }}
          path: /tmp/digests/*
          retention-days: 1

  # One tag, both platforms: a manifest list over the two digests.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Image names are lower case; the repository is ExeQue/lumberjack.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
